# master_profile.example.yaml — a template you fill in with YOUR details.
#
# HOW TO USE:
#   1. Copy this file to "master_profile.yaml" in the same folder.
#   2. Replace every value below with your own real information.
#   3. In the app, open Profile and click "Import from YAML".
#
# The person below (Alex Rivera) is a made-up example so you can see the shape.
# Nothing here is real. Delete it and put in your own facts. The golden rule of
# this app: it only ever uses what you put in your profile. It never invents.

